<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Word Puzzle - GitHub Version</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .quiz-box {
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding: 20px;
            background-color: #f1f3f5;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            line-height: 1.6;
        }
        .petunjuk {
            font-size: 0.95rem;
            color: #6c757d;
            margin-bottom: 25px;
            background-color: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #ffc107;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border: 2px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-submit { background-color: #3498db; color: white; }
        .btn-submit:hover { background-color: #2980b9; }
        .btn-next { background-color: #2ecc71; color: white; }
        .btn-next:hover { background-color: #27ae60; }
        .btn-restart { background-color: #e67e22; color: white; margin-top: 15px; }
        .btn-restart:hover { background-color: #d35400; }
        
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .alert-sukses { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-salah { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .hasil-akhir {
            text-align: center;
            padding: 20px;
        }
        .skor-besar {
            font-size: 3.5rem;
            color: #2ecc71;
            font-weight: bold;
            margin: 20px 0;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧩 English Word Puzzle</h1>

    <!-- TAMPILAN GAMEPLAY -->
    <div id="game-panel">
        <div class="info-panel">
            <span id="info-soal">Soal: 1 / 10</span>
            <span id="info-skor">Skor: 0</span>
        </div>

        <div id="feedback-box" class="alert hidden"></div>

        <div id="kalimat-box" class="quiz-box">Loading...</div>

        <div class="petunjuk">
            💡 <strong>Hint:</strong> <span id="petunjuk-box">-</span>
        </div>

        <input type="text" id="jawaban-user" placeholder="Ketik kata pelengkap di sini..." autofocus>
        <button id="btn-aksi" class="btn-submit">Periksa jawaban</button>
    </div>

    <!-- TAMPILAN SELESAI -->
    <div id="result-panel" class="hasil-akhir hidden">
        <h2>🎉 Finished!!</h2>
        <p>Great! You have completed this game</p>
        <div id="skor-akhir" class="skor-besar">0 / 100</div>
        <button id="btn-ulang" class="btn-restart">Play Again (Take New Random) 🔄</button>
    </div>
</div>

<script>
// 1. BANK SOAL (50 Soal)
const bankSoal = [
    {kalimat: "The sun rises in the ____ and sets in the west.", jawaban: "east", petunjuk: "Arah matahari terbit."},
    {kalimat: "An apple a day keeps the ____ away.", jawaban: "doctor", petunjuk: "Orang yang memeriksa medis saat kita sakit."},
    {kalimat: "She is ____ a book in the library right now.", jawaban: "reading", petunjuk: "Aktivitas memahami isi buku (Verb-ing)."},
    {kalimat: "Cats like to catch ____.", jawaban: "mice", petunjuk: "Bentuk jamak dari mouse (tikus)."},
    {kalimat: "Water boils at 100 ____ Celsius.", jawaban: "degrees", petunjuk: "Satuan pengukur suhu."},
    {kalimat: "I have two ____. I use them to walk.", jawaban: "legs", petunjuk: "Bagian tubuh bawah untuk berjalan (jamak)."},
    {kalimat: "The elephant is a very ____ animal.", jawaban: "big", petunjuk: "Lawan kata dari small."},
    {kalimat: "Ice is cold, but fire is ____.", jawaban: "hot", petunjuk: "Lawan kata dari cold."},
    {kalimat: "We use our ____ to smell flowers.", jawaban: "nose", petunjuk: "Indra penciuman."},
    {kalimat: "A ____ has seven days.", jawaban: "week", petunjuk: "Satu pekan."},
    {kalimat: "The sky is usually ____ on a clear day.", jawaban: "blue", petunjuk: "Warna langit cerah."},
    {kalimat: "Fish live and swim in the ____.", jawaban: "water", petunjuk: "Zat cair tempat hidup biota laut."},
    {kalimat: "My father's brother is my ____.", jawaban: "uncle", petunjuk: "Paman."},
    {kalimat: "Please turn ____ the light before you go to sleep.", jawaban: "off", petunjuk: "Mematikan aliran listrik (turn ...)."},
    {kalimat: "The ____ is known as the king of the jungle.", jawaban: "lion", petunjuk: "Singa."},
    {kalimat: "I am hungry, I want to ____ some food.", jawaban: "eat", petunjuk: "Makan."},
    {kalimat: "Tomorrow is Wednesday, so today is ____.", jawaban: "tuesday", petunjuk: "Hari sebelum Rabu."},
    {kalimat: "A ________ works in a hospital and helps patients.", jawaban: "nurse", petunjuk: "Perawat."},
    {kalimat: "The opposite of 'rich' is ____.", jawaban: "poor", petunjuk: "Miskin."},
    {kalimat: "We buy books at a ____.", jawaban: "bookstore", petunjuk: "Toko buku."},
    {kalimat: "A year has twelve ____.", jawaban: "months", petunjuk: "Bulan (jamak)."},
    {kalimat: "Sugar is sweet, but lemon is ____.", jawaban: "sour", petunjuk: "Asam."},
    {kalimat: "We use an ____ when it rains.", jawaban: "umbrella", petunjuk: "Payung."},
    {kalimat: "The color of milk is ____.", jawaban: "white", petunjuk: "Putih."},
    {kalimat: "A ________ flies an airplane.", jawaban: "pilot", petunjuk: "Pengemudi pesawat terbang."},
    {kalimat: "I listen to music with my ____.", jawaban: "ears", petunjuk: "Telinga (jamak)."},
    {kalimat: "Birds can fly because they have ____.", jawaban: "wings", petunjuk: "Sayap."},
    {kalimat: "The opposite of 'heavy' is ____.", jawaban: "light", petunjuk: "Ringan."},
    {kalimat: "We write on the whiteboard using a ____.", jawaban: "marker", petunjuk: "Spidol."},
    {kalimat: "A cow produces ________ for us to drink.", jawaban: "milk", petunjuk: "Susu."},
    {kalimat: "The ________ is the tallest animal on land.", jawaban: "giraffe", petunjuk: "Jerapah."},
    {kalimat: "My mother's daughter is my ____.", jawaban: "sister", petunjuk: "Saudara perempuan."},
    {kalimat: "Keep your mouth ____ while chewing food.", jawaban: "closed", petunjuk: "Tertutup."},
    {kalimat: "We wash our hands with water and ____.", jawaban: "soap", petunjuk: "Sabun."},
    {kalimat: "A ________ teaches students at school.", jawaban: "teacher", petunjuk: "Guru."},
    {kalimat: "The opposite of 'fast' is ____.", jawaban: "slow", petunjuk: "Lambat."},
    {kalimat: "The ________ goes around the Earth.", jawaban: "moon", petunjuk: "Bulan (Satelit Bumi)."},
    {kalimat: "I am ________. Can I have a glass of water?", jawaban: "thirsty", petunjuk: "Haus."},
    {kalimat: "We put trash into the trash ____.", jawaban: "can", petunjuk: "Tong/bak (trash ...)."},
    {kalimat: "The day after Friday is ____.", "jawaban": "saturday", "petunjuk": "Hari Sabtu."},
    {kalimat: "A ________ barks at strangers.", jawaban: "dog", petunjuk: "Anjing."},
    {kalimat: "We use a knife to ____ vegetables.", jawaban: "cut", petunjuk: "Memotong."},
    {kalimat: "The opposite of 'difficult' is ____.", jawaban: "easy", petunjuk: "Mudah."},
    {kalimat: "A ________ makes bread and cakes.", jawaban: "baker", petunjuk: "Tukang roti."},
    {kalimat: "The ________ is the largest ocean on Earth.", jawaban: "pacific", petunjuk: "Samudra Pasifik."},
    {kalimat: "We wear ____ on our feet before wearing shoes.", jawaban: "socks", petunjuk: "Kaus kaki."},
    {kalimat: "Red, yellow, and green are ____.", jawaban: "colors", petunjuk: "Warna-warna."},
    {kalimat: "My father drives a ____ to work every day.", jawaban: "car", petunjuk: "Mobil."},
    {kalimat: "A ________ grows rice in the field.", jawaban: "farmer", petunjuk: "Petani."},
    {kalimat: "The opposite of 'happy' is ____.", jawaban: "sad", petunjuk: "Sedih."}
];

const jumlahSoalPerGame = 10;
let daftarSoal = [];
let indexSekarang = 0;
let skor = 0;
let statusMenjawab = "cek"; // 'cek' atau 'lanjut'

// DOM Elements
const gamePanel = document.getElementById('game-panel');
const resultPanel = document.getElementById('result-panel');
const infoSoal = document.getElementById('info-soal');
const infoSkor = document.getElementById('info-skor');
const feedbackBox = document.getElementById('feedback-box');
const kalimatBox = document.getElementById('kalimat-box');
const petunjukBox = document.getElementById('petunjuk-box');
const jawabanUser = document.getElementById('jawaban-user');
const btnAksi = document.getElementById('btn-aksi');
const skorAkhir = document.getElementById('skor-akhir');
const btnUlang = document.getElementById('btn-ulang');

// Fungsi memulai game baru
function mulaiGame() {
    // Acak soal menggunakan metode Fisher-Yates shuffle
    let shuffled = [...bankSoal].sort(() => 0.5 - Math.random());
    daftarSoal = shuffled.slice(0, jumlahSoalPerGame);
    
    indexSekarang = 0;
    skor = 0;
    tampilkanSoal();
    
    gamePanel.classList.remove('hidden');
    resultPanel.classList.add('hidden');
}

// Fungsi menampilkan soal aktif
function tampilkanSoal() {
    feedbackBox.classList.add('hidden');
    jawabanUser.value = "";
    jawabanUser.disabled = false;
    jawabanUser.focus();
    
    infoSoal.innerText = `Soal: ${indexSekarang + 1} / ${jumlahSoalPerGame}`;
    infoSkor.innerText = `Skor: ${skor}`;
    
    kalimatBox.innerText = daftarSoal[indexSekarang].kalimat;
    petunjukBox.innerText = daftarSoal[indexSekarang].petunjuk;
    
    btnAksi.innerText = "Periksa jawaban";
    btnAksi.className = "btn-submit";
    statusMenjawab = "cek";
}

// Event handler tombol aksi
btnAksi.addEventListener('click', () => {
    if (statusMenjawab === "cek") {
        let input = jawabanUser.value.trim().toLowerCase();
        let kunci = daftarSoal[indexSekarang].jawaban.toLowerCase();
        
        feedbackBox.classList.remove('hidden');
        jawabanUser.disabled = true;
        
        if (input === kunci) {
            feedbackBox.innerText = "🎉 Correct! Jawaban Anda benar.";
            feedbackBox.className = "alert alert-sukses";
            skor += (100 / jumlahSoalPerGame);
            infoSkor.innerText = `Skor: ${skor}`;
        } else {
            feedbackBox.innerHTML = `❌ Incorrect! Jawaban yang benar adalah: <strong>${daftarSoal[indexSekarang].jawaban}</strong>`;
            feedbackBox.className = "alert alert-salah";
        }
        
        btnAksi.innerText = "Soal Selanjutnya ➡️";
        btnAksi.className = "btn-next";
        statusMenjawab = "lanjut";
    } else {
        indexSekarang++;
        if (indexSekarang < jumlahSoalPerGame) {
            tampilkanSoal();
        } else {
            // Game Over
            gamePanel.classList.add('hidden');
            resultPanel.classList.remove('hidden');
            skorAkhir.innerText = `${skor} / 100`;
        }
    }
});

// Menjalankan cek saat tekan Enter
jawabanUser.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && jawabanUser.value.trim() !== "") {
        btnAksi.click();
    }
});

btnUlang.addEventListener('click', mulaiGame);

// Jalankan game saat halaman pertama dimuat
mulaiGame();
</script>
</body>
</html>
